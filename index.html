<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar for young learners</title>
  <style>
    :root {
      --primary-color: #3182CE;
      --accent-color: #FFB300;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --success: #38A169;
      --danger: #E53E3E;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }

    body { 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: var(--text-main);
      background: radial-gradient(circle at 10% 15%, rgba(74, 144, 226, 0.35), transparent 45%),
                  radial-gradient(circle at 90% 15%, rgba(229, 62, 62, 0.28), transparent 45%),
                  radial-gradient(circle at 15% 85%, rgba(255, 179, 0, 0.32), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(128, 90, 213, 0.28), transparent 45%),
                  #DCE6F2;
      background-attachment: fixed;
      padding: 20px 0;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(165deg, #EBF3FA 0%, #DFEAF7 50%, #EEF5FC 100%);
      border-radius: 28px;
      border: 3.5px solid #FFFFFF;
      box-shadow: 
        0 24px 48px -12px rgba(30, 64, 110, 0.28),
        0 8px 16px -4px rgba(30, 64, 110, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.95),
        inset 0 -2px 4px rgba(74, 144, 226, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 15px 20px;
      padding: 35px 35px;
    }

    .view-screen { 
      display: none; 
      flex-direction: column; 
      width: 100%; 
      align-items: center; 
    }
    .view-screen.active { 
      display: flex; 
    }

    /* 弧形兩行式標題 */
    .curved-header { 
      text-align: center; 
      margin-bottom: 24px; 
      position: relative; 
      width: 100%; 
    }
    .header-brackets-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 38px;
    }
    .header-brackets-wrapper::before {
      content: "(";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-52%);
      font-size: 3.8rem;
      font-weight: 300;
      color: #94A3B8;
      line-height: 1;
    }
    .header-brackets-wrapper::after {
      content: ")";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-52%);
      font-size: 3.8rem;
      font-weight: 300;
      color: #94A3B8;
      line-height: 1;
    }

    .header-text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .header-title-main {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #1A365D;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .header-title-sub {
      font-size: 1.45rem;
      font-weight: 700;
      font-style: italic;
      color: #3182CE;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .header-curve-line {
      width: 290px;
      height: 16px;
      border: solid 3px #CBD5E1;
      border-color: #CBD5E1 transparent transparent transparent;
      border-radius: 50%/14px 14px 0 0;
      margin: 8px auto 0 auto;
    }

    /* 首頁封面陳列 (上 3 下 2) */
    .books-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 30px;
    }
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .book-item {
      position: relative;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 14px 28px rgba(30, 64, 110, 0.22);
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
    }
    .book-item img {
      width: 155px;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-item:hover {
      transform: translateY(-10px) scale(1.06) rotate(0deg) !important;
      box-shadow: 0 22px 36px rgba(30, 64, 110, 0.32);
      z-index: 10;
    }

    /* 角度旋轉層次 */
    .row-top .book-item:nth-child(1) { transform: rotate(-4deg); }
    .row-top .book-item:nth-child(2) { transform: rotate(0deg) translateY(-4px); }
    .row-top .book-item:nth-child(3) { transform: rotate(4deg); }
    .row-bottom .book-item:nth-child(1) { transform: rotate(-3deg); }
    .row-bottom .book-item:nth-child(2) { transform: rotate(3deg); }

    .btn-start {
      padding: 14px 64px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2D3748;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      border: 2.5px solid #CBD5E0;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(30, 64, 110, 0.14);
    }
    .btn-start:hover { 
      background: #2D3748; 
      color: #FFF; 
      border-color: #2D3748;
      transform: translateY(-3px); 
      box-shadow: 0 12px 24px rgba(45, 55, 72, 0.25);
    }

    /* 目錄頁：簡潔卡片網格 (不顯示預設主題名稱) */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 780px;
      margin: 15px auto 26px auto;
    }
    .menu-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      border-left: 6px solid #CBD5E0;
      transition: all 0.25s ease;
    }
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(49, 130, 206, 0.18);
    }

    .badge-b {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      color: #FFF;
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .card-info {
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #2D3748;
    }

    /* 5 個書冊色彩對應 */
    .c-b1 { border-left-color: #3182CE; }
    .c-b1 .badge-b { background: linear-gradient(135deg, #4299E1, #3182CE); }
    .c-b2 { border-left-color: #38A169; }
    .c-b2 .badge-b { background: linear-gradient(135deg, #48BB78, #38A169); }
    .c-b3 { border-left-color: #DD6B20; }
    .c-b3 .badge-b { background: linear-gradient(135deg, #ED8936, #DD6B20); }
    .c-b4 { border-left-color: #D53F8C; }
    .c-b4 .badge-b { background: linear-gradient(135deg, #ED64A6, #D53F8C); }
    .c-b5 { border-left-color: #6B46C1; }
    .c-b5 .badge-b { background: linear-gradient(135deg, #805AD5, #6B46C1); }

    .btn-secondary {
      padding: 10px 30px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #CBD5E0;
      color: #4A5568;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #FFFFFF;
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }

    /* 題庫製作中畫面 */
    .under-construction-box {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 38px 24px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
    }
    .target-book-preview {
      width: 110px;
      height: 156px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin-bottom: 4px;
    }
    .cons-icon {
      font-size: 2.8rem;
    }
    .cons-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #1A365D;
    }
    .cons-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 680px) {
      body { padding: 0; }
      .app-container {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 22px 14px;
        border: none;
      }
      .header-title-main { font-size: 1.85rem; }
      .header-title-sub { font-size: 1.05rem; }
      .header-brackets-wrapper::before,
      .header-brackets-wrapper::after { font-size: 2.6rem; }
      .header-curve-line { width: 190px; height: 12px; }
      .books-display { gap: 14px; margin-bottom: 22px; }
      .books-row { gap: 10px; }
      .book-item img { width: 95px; height: 135px; }
      .menu-grid { grid-template-columns: 1fr; gap: 12px; }
      .btn-start { padding: 12px 50px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 扉頁 (首頁) -->
  <section id="screen-cover" class="view-screen active">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="books-display">
      <!-- 第一排：Book 1, Book 2, Book 3 -->
      <div class="books-row row-top">
        <div class="book-item" onclick="openBookComingSoon(1)">
          <img src="./images/b1.png" alt="Grammar Book 1">
        </div>
        <div class="book-item" onclick="openBookComingSoon(2)">
          <img src="./images/b2.png" alt="Grammar Book 2">
        </div>
        <div class="book-item" onclick="openBookComingSoon(3)">
          <img src="./images/b3.png" alt="Grammar Book 3">
        </div>
      </div>

      <!-- 第二排：Book 4, Book 5 -->
      <div class="books-row row-bottom">
        <div class="book-item" onclick="openBookComingSoon(4)">
          <img src="./images/b4.png" alt="Grammar Book 4">
        </div>
        <div class="book-item" onclick="openBookComingSoon(5)">
          <img src="./images/b5.png" alt="Grammar Book 5">
        </div>
      </div>
    </div>

    <button class="btn-start" onclick="navigateTo('screen-menu')">START</button>
  </section>

  <!-- 2. 目錄頁 -->
  <section id="screen-menu" class="view-screen">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="menu-grid">
      <div class="menu-card c-b1" onclick="openBookComingSoon(1)">
        <div class="badge-b">B1</div>
        <div class="card-info">
          <div class="card-title">Book 1</div>
        </div>
      </div>

      <div class="menu-card c-b2" onclick="openBookComingSoon(2)">
        <div class="badge-b">B2</div>
        <div class="card-info">
          <div class="card-title">Book 2</div>
        </div>
      </div>

      <div class="menu-card c-b3" onclick="openBookComingSoon(3)">
        <div class="badge-b">B3</div>
        <div class="card-info">
          <div class="card-title">Book 3</div>
        </div>
      </div>

      <div class="menu-card c-b4" onclick="openBookComingSoon(4)">
        <div class="badge-b">B4</div>
        <div class="card-info">
          <div class="card-title">Book 4</div>
        </div>
      </div>

      <div class="menu-card c-b5" onclick="openBookComingSoon(5)">
        <div class="badge-b">B5</div>
        <div class="card-info">
          <div class="card-title">Book 5</div>
        </div>
      </div>
    </div>

    <button class="btn-secondary" onclick="navigateTo('screen-cover')">← 回到主頁</button>
  </section>

  <!-- 3. 題庫製作中畫面 -->
  <section id="screen-construction" class="view-screen">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="under-construction-box">
      <img id="consBookImg" src="./images/b1.png" alt="Book Cover" class="target-book-preview">
      <div class="cons-icon">🚧</div>
      <h2 class="cons-title" id="consBookTitle">Book 1 題庫製作中</h2>
      <p class="cons-desc">本冊文法練習題目正在積極編寫中，敬請期待！</p>
      
      <div style="display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center;">
        <button class="btn-secondary" onclick="navigateTo('screen-menu')">📚 回書籍目錄</button>
        <button class="btn-secondary" onclick="navigateTo('screen-cover')">🏠 回首頁</button>
      </div>
    </div>
  </section>

</div>

<script>
  function navigateTo(screenId) {
    document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
  }

  function openBookComingSoon(bookNum) {
    const titleEl = document.getElementById('consBookTitle');
    const imgEl = document.getElementById('consBookImg');
    
    if (titleEl) titleEl.innerText = `Book ${bookNum} 題庫製作中`;
    if (imgEl) imgEl.src = `./images/b${bookNum}.png`;
    
    navigateTo('screen-construction');
  }
</script>

</body>
</html>
