<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar for young learners</title>
  <style>
    :root {
      --primary-color: #3182CE;
      --accent-color: #FFB300;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --success: #38A169;
      --danger: #E53E3E;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }

    body { 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: var(--text-main);
      background: radial-gradient(circle at 10% 15%, rgba(74, 144, 226, 0.35), transparent 45%),
                  radial-gradient(circle at 90% 15%, rgba(229, 62, 62, 0.28), transparent 45%),
                  radial-gradient(circle at 15% 85%, rgba(255, 179, 0, 0.32), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(128, 90, 213, 0.28), transparent 45%),
                  #DCE6F2;
      background-attachment: fixed;
      padding: 20px 0;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(165deg, #EBF3FA 0%, #DFEAF7 50%, #EEF5FC 100%);
      border-radius: 28px;
      border: 3.5px solid #FFFFFF;
      box-shadow: 
        0 24px 48px -12px rgba(30, 64, 110, 0.28),
        0 8px 16px -4px rgba(30, 64, 110, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.95),
        inset 0 -2px 4px rgba(74, 144, 226, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin: 15px 20px;
      padding: 35px 35px;
    }

    .view-screen { 
      display: none; 
      flex-direction: column; 
      width: 100%; 
      align-items: center; 
    }
    .view-screen.active { 
      display: flex; 
    }

    /* 弧形兩行式標題 */
    .curved-header { 
      text-align: center; 
      margin-bottom: 24px; 
      position: relative; 
      width: 100%; 
    }
    .header-brackets-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 38px;
    }
    .header-brackets-wrapper::before {
      content: "(";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-52%);
      font-size: 3.8rem;
      font-weight: 300;
      color: #94A3B8;
      line-height: 1;
    }
    .header-brackets-wrapper::after {
      content: ")";
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-52%);
      font-size: 3.8rem;
      font-weight: 300;
      color: #94A3B8;
      line-height: 1;
    }

    .header-text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .header-title-main {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #1A365D;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .header-title-sub {
      font-size: 1.45rem;
      font-weight: 700;
      font-style: italic;
      color: #3182CE;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .header-curve-line {
      width: 290px;
      height: 16px;
      border: solid 3px #CBD5E1;
      border-color: #CBD5E1 transparent transparent transparent;
      border-radius: 50%/14px 14px 0 0;
      margin: 8px auto 0 auto;
    }

    /* 首頁封面陳列 */
    .books-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      margin-top: 8px;
      margin-bottom: 30px;
    }
    .books-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .book-item {
      position: relative;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 14px 28px rgba(30, 64, 110, 0.22);
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
    }
    .book-item img {
      width: 155px;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .book-item:hover {
      transform: translateY(-10px) scale(1.06) rotate(0deg) !important;
      box-shadow: 0 22px 36px rgba(30, 64, 110, 0.32);
      z-index: 10;
    }

    .row-top .book-item:nth-child(1) { transform: rotate(-4deg); }
    .row-top .book-item:nth-child(2) { transform: rotate(0deg) translateY(-4px); }
    .row-top .book-item:nth-child(3) { transform: rotate(4deg); }
    .row-bottom .book-item:nth-child(1) { transform: rotate(-3deg); }
    .row-bottom .book-item:nth-child(2) { transform: rotate(3deg); }

    .btn-start {
      padding: 14px 64px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2D3748;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      border: 2.5px solid #CBD5E0;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(30, 64, 110, 0.14);
    }
    .btn-start:hover { 
      background: #2D3748; 
      color: #FFF; 
      border-color: #2D3748;
      transform: translateY(-3px); 
      box-shadow: 0 12px 24px rgba(45, 55, 72, 0.25);
    }

    /* 目錄頁：卡片網格 */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 780px;
      margin: 15px auto 26px auto;
    }
    .menu-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      border-left: 6px solid #CBD5E0;
      transition: all 0.25s ease;
    }
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(49, 130, 206, 0.18);
    }

    .badge-b {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      color: #FFF;
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .card-info {
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #2D3748;
    }

    .c-b1 { border-left-color: #3182CE; }
    .c-b1 .badge-b { background: linear-gradient(135deg, #4299E1, #3182CE); }
    .c-b2 { border-left-color: #38A169; }
    .c-b2 .badge-b { background: linear-gradient(135deg, #48BB78, #38A169); }
    .c-b3 { border-left-color: #DD6B20; }
    .c-b3 .badge-b { background: linear-gradient(135deg, #ED8936, #DD6B20); }
    .c-b4 { border-left-color: #D53F8C; }
    .c-b4 .badge-b { background: linear-gradient(135deg, #ED64A6, #D53F8C); }
    .c-b5 { border-left-color: #6B46C1; }
    .c-b5 .badge-b { background: linear-gradient(135deg, #805AD5, #6B46C1); }

    .btn-secondary {
      padding: 10px 30px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #CBD5E0;
      color: #4A5568;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #FFFFFF;
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }

    /* 題庫製作中畫面 */
    .under-construction-box {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 38px 24px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
    }
    .target-book-preview {
      width: 110px;
      height: 156px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin-bottom: 4px;
    }

    /* =========================================
       測驗畫面樣式 (第一大題 & 第二大題連連看)
       ========================================= */
    #screen-quiz {
      justify-content: flex-start;
      width: 100%;
    }
    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .part-indicators {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      width: 100%;
    }
    .indicator-pill {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-muted);
      border: 1.5px solid #CBD5E0;
    }
    .indicator-pill.active {
      background: var(--primary-color);
      color: #FFF;
      border-color: var(--primary-color);
    }

    .quiz-card {
      width: 100%;
      background: #FFFFFF;
      border-radius: 18px;
      padding: 26px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #E2E8F0;
      border-radius: 4px;
      margin: 0 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-passage {
      width: 100%;
      background: #F8FAFC;
      border-left: 4px solid var(--primary-color);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4A5568;
      margin-bottom: 16px;
      white-space: pre-line;
      text-align: left;
    }
    .cloze-num {
      font-weight: 800;
      color: var(--primary-color);
    }

    .question-text {
      font-size: 1.45rem;
      font-weight: 800;
      color: #1A365D;
      margin-bottom: 22px;
      text-align: center;
      white-space: pre-line;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }
    .btn-opt {
      width: 100%;
      padding: 14px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      background: #FFFFFF;
      color: #2D3748;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .btn-opt:hover:not(:disabled) {
      border-color: var(--primary-color);
      background: #F7FAFC;
    }
    .btn-opt.correct {
      background: var(--success) !important;
      color: #FFF !important;
      border-color: var(--success) !important;
    }
    .btn-opt.wrong {
      background: var(--danger) !important;
      color: #FFF !important;
      border-color: var(--danger) !important;
    }

    /* 連連看專用樣式 */
    .match-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      width: 100%;
      max-width: 660px;
      margin: 10px 0 20px 0;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-btn {
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 12px;
      border: 2px solid #CBD5E0;
      background: #FFFFFF;
      color: #2D3748;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .match-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background: #F0F7FF;
    }
    .match-btn.selected {
      border-color: var(--primary-color);
      background: #EBF8FF;
      color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }
    .match-btn.matched {
      background: #F0FFF4 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      cursor: default;
      opacity: 0.6;
    }
    .match-btn.shake {
      animation: shake 0.4s ease-in-out;
      border-color: var(--danger) !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (max-width: 680px) {
      body { padding: 0; }
      .app-container {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 22px 14px;
        border: none;
      }
      .header-title-main { font-size: 1.85rem; }
      .header-title-sub { font-size: 1.05rem; }
      .header-brackets-wrapper::before,
      .header-brackets-wrapper::after { font-size: 2.6rem; }
      .header-curve-line { width: 190px; height: 12px; }
      .books-display { gap: 14px; margin-bottom: 22px; }
      .books-row { gap: 10px; }
      .book-item img { width: 95px; height: 135px; }
      .menu-grid { grid-template-columns: 1fr; gap: 12px; }
      .match-container { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 扉頁 (首頁) -->
  <section id="screen-cover" class="view-screen active">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="books-display">
      <div class="books-row row-top">
        <div class="book-item" onclick="handleBookClick(1)">
          <img src="./images/b1.png" alt="Grammar Book 1">
        </div>
        <div class="book-item" onclick="handleBookClick(2)">
          <img src="./images/b2.png" alt="Grammar Book 2">
        </div>
        <div class="book-item" onclick="handleBookClick(3)">
          <img src="./images/b3.png" alt="Grammar Book 3">
        </div>
      </div>

      <div class="books-row row-bottom">
        <div class="book-item" onclick="handleBookClick(4)">
          <img src="./images/b4.png" alt="Grammar Book 4">
        </div>
        <div class="book-item" onclick="handleBookClick(5)">
          <img src="./images/b5.png" alt="Grammar Book 5">
        </div>
      </div>
    </div>

    <button class="btn-start" onclick="navigateTo('screen-menu')">START</button>
  </section>

  <!-- 2. 目錄頁 -->
  <section id="screen-menu" class="view-screen">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="menu-grid">
      <div class="menu-card c-b1" onclick="handleBookClick(1)">
        <div class="badge-b">B1</div>
        <div class="card-info"><div class="card-title">Book 1</div></div>
      </div>
      <div class="menu-card c-b2" onclick="handleBookClick(2)">
        <div class="badge-b">B2</div>
        <div class="card-info"><div class="card-title">Book 2</div></div>
      </div>
      <div class="menu-card c-b3" onclick="handleBookClick(3)">
        <div class="badge-b">B3</div>
        <div class="card-info"><div class="card-title">Book 3</div></div>
      </div>
      <div class="menu-card c-b4" onclick="handleBookClick(4)">
        <div class="badge-b">B4</div>
        <div class="card-info"><div class="card-title">Book 4</div></div>
      </div>
      <div class="menu-card c-b5" onclick="handleBookClick(5)">
        <div class="badge-b">B5</div>
        <div class="card-info"><div class="card-title">Book 5</div></div>
      </div>
    </div>

    <button class="btn-secondary" onclick="navigateTo('screen-cover')">← 回到主頁</button>
  </section>

  <!-- 3. 題庫製作中畫面 -->
  <section id="screen-construction" class="view-screen">
    <div class="curved-header">
      <div class="header-brackets-wrapper">
        <div class="header-text-group">
          <div class="header-title-main">Grammar</div>
          <div class="header-title-sub">for young learners</div>
        </div>
      </div>
      <div class="header-curve-line"></div>
    </div>

    <div class="under-construction-box">
      <img id="consBookImg" src="./images/b1.png" alt="Book Cover" class="target-book-preview">
      <div style="font-size: 2.5rem;">🚧</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #1A365D;" id="consBookTitle">Book 題庫製作中</h2>
      <p style="font-size: 1rem; color: var(--text-muted); line-height: 1.5;">本冊文法練習題目正在積極編寫中，敬請期待！</p>
      
      <div style="display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center;">
        <button class="btn-secondary" onclick="navigateTo('screen-menu')">📚 回書籍目錄</button>
        <button class="btn-secondary" onclick="navigateTo('screen-cover')">🏠 回首頁</button>
      </div>
    </div>
  </section>

  <!-- 4. 測驗作答畫面 (第一大題隨機抽題 + 第二大題連連看) -->
  <section id="screen-quiz" class="view-screen">
    <div class="quiz-nav">
      <button class="btn-secondary" style="padding: 6px 16px; font-size: 0.9rem;" onclick="navigateTo('screen-menu')">← 回目錄</button>
      <span id="quizBookTag" style="font-weight: 800; color: #1A365D;">Book 1 練習</span>
    </div>

    <div class="part-indicators">
      <div id="pill-part1" class="indicator-pill active">第一大題：Review 綜合測驗</div>
      <div id="pill-part2" class="indicator-pill">第二大題：文法連連看</div>
    </div>

    <div id="quizContainer" style="width: 100%;"></div>
  </section>

</div>

<script>
  function navigateTo(screenId) {
    document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
  }

  function handleBookClick(bookNum) {
    loadBookQuiz(bookNum);
  }

  function openBookComingSoon(bookNum) {
    const titleEl = document.getElementById('consBookTitle');
    const imgEl = document.getElementById('consBookImg');
    if (titleEl) titleEl.innerText = `Book ${bookNum} 題庫製作中`;
    if (imgEl) imgEl.src = `./images/b${bookNum}.png`;
    navigateTo('screen-construction');
  }

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // 將選項中的分號統一標準化為斜線格式 " / "
  function formatOptionText(txt) {
    if (!txt) return "";
    return String(txt).replace(/\s*[;；]\s*/g, ' / ');
  }

  // 處理克漏字文章與題幹編號：
  // 1. 有附帶文章 (q.passage) 時，文章內 [15] 轉 (1)，題幹「第 15 題：」轉為「(1) 」以便對照
  // 2. 無附帶文章的獨立題目，直接移除「第 X 題：」，不顯示括號與數字
  function getClozeFormattedData(q) {
    let formattedPassage = "";
    let formattedQuestion = q.question || "";

    if (q.passage) {
      let clozeOffset = 0;
      const matches = [...q.passage.matchAll(/\[(\d+)\]/g)];
      if (matches.length > 0) {
        const minNum = Math.min(...matches.map(m => parseInt(m[1], 10)));
        clozeOffset = minNum - 1;
      }

      formattedPassage = q.passage.replace(/\[(\d+)\]/g, (_, numStr) => {
        const newNum = parseInt(numStr, 10) - clozeOffset;
        return `<span class="cloze-num">(${newNum})</span>`;
      });

      formattedQuestion = formattedQuestion.replace(/^第\s*(\d+)\s*題[：:]\s*/, (_, numStr) => {
        const origNum = parseInt(numStr, 10);
        const newNum = clozeOffset > 0 ? (origNum - clozeOffset) : origNum;
        return `(${newNum}) `;
      });
    } else {
      formattedQuestion = formattedQuestion.replace(/^第\s*\d+\s*題[：:]\s*/, '');
    }

    return { formattedPassage, formattedQuestion };
  }

  // ================= 測驗狀態與邏輯 =================
  let currentBookNum = 1;
  let currentBookData = null;
  let p1Questions = [];
  let p1Index = 0;
  let p1Score = 0;

  let p2Sets = [];
  let p2SetIndex = 0;
  let selectedLeft = null;
  let selectedRight = null;
  let matchedCount = 0;

  async function loadBookQuiz(bookNum) {
    currentBookNum = bookNum;
    const bookTag = document.getElementById('quizBookTag');
    
    try {
      const res = await fetch(`./b${bookNum}.json`);
      if (!res.ok) {
        openBookComingSoon(bookNum);
        return;
      }
      currentBookData = await res.json();
      if (bookTag) bookTag.innerText = `${currentBookData.bookTitle || `Book ${bookNum}`} 練習`;
      navigateTo('screen-quiz');
      startBookPractice();
    } catch (e) {
      openBookComingSoon(bookNum);
    }
  }

  function startBookPractice() {
    p1Score = 0;
    p1Index = 0;
    const sampleSize = (currentBookData.part1 && currentBookData.part1.sampleCount) || 10;
    const shuffledPool = shuffle(currentBookData.part1.questions || []);
    p1Questions = shuffledPool.slice(0, sampleSize);

    p2Sets = currentBookData.part2.sets || [];
    p2SetIndex = 0;

    setStageIndicator(1);
    renderPart1Question();
  }

  function setStageIndicator(stageNum) {
    document.getElementById('pill-part1').classList.toggle('active', stageNum === 1);
    document.getElementById('pill-part2').classList.toggle('active', stageNum === 2);
  }

  // ================= 第一大題：單選題 =================
  function renderPart1Question() {
    if (p1Index >= p1Questions.length) {
      startPart2();
      return;
    }

    const q = p1Questions[p1Index];
    const total = p1Questions.length;
    const progress = ((p1Index + 1) / total) * 100;
    const container = document.getElementById('quizContainer');

    const formattedAnswer = formatOptionText(q.answer);
    const { formattedPassage, formattedQuestion } = getClozeFormattedData(q);

    container.innerHTML = `
      <div class="quiz-card">
        <div class="progress-wrap">
          <span>Question ${p1Index + 1} / ${total}</span>
          <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
          <span>得分: ${p1Score}</span>
        </div>

        ${formattedPassage ? `<div class="question-passage">${formattedPassage}</div>` : ''}

        <div class="question-text">
          <span>${formattedQuestion}</span>
        </div>

        <div class="options-grid">
          ${q.options.map(opt => {
            const formattedOpt = formatOptionText(opt);
            return `
              <button class="btn-opt" data-value="${formattedOpt}" onclick="handleP1Answer(this, '${formattedOpt.replace(/'/g, "\\'")}', '${formattedAnswer.replace(/'/g, "\\'")}')">${formattedOpt}</button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function handleP1Answer(btn, selected, correct) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);

    if (selected === correct) {
      btn.classList.add('correct');
      p1Score++;
    } else {
      btn.classList.add('wrong');
      parent.querySelectorAll('.btn-opt').forEach(b => {
        if (b.getAttribute('data-value') === correct) b.classList.add('correct');
      });
    }

    setTimeout(() => {
      p1Index++;
      renderPart1Question();
    }, 850);
  }

  // ================= 第二大題：文法連連看 =================
  function startPart2() {
    setStageIndicator(2);
    p2SetIndex = 0;
    renderPart2Set();
  }

  function renderPart2Set() {
    if (p2SetIndex >= p2Sets.length) {
      renderQuizSummary();
      return;
    }

    const curSet = p2Sets[p2SetIndex];
    matchedCount = 0;
    selectedLeft = null;
    selectedRight = null;

    const leftList = shuffle(curSet.pairs.map((p, idx) => ({ id: idx, text: p.left })));
    const rightList = shuffle(curSet.pairs.map((p, idx) => ({ id: idx, text: p.right })));

    const container = document.getElementById('quizContainer');
    container.innerHTML = `
      <div class="quiz-card">
        <div class="progress-wrap">
          <span>${curSet.setName}</span>
          <span>關卡 ${p2SetIndex + 1} / ${p2Sets.length}</span>
        </div>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 16px;">
          請先點擊左側項目，再點擊右側正確對應項目進行連線配對。
        </p>

        <div class="match-container">
          <div class="match-col">
            ${leftList.map(item => `
              <button class="match-btn" data-type="left" data-id="${item.id}" onclick="handleMatchClick(this, 'left', ${item.id})">
                ${item.text}
              </button>
            `).join('')}
          </div>
          <div class="match-col">
            ${rightList.map(item => `
              <button class="match-btn" data-type="right" data-id="${item.id}" onclick="handleMatchClick(this, 'right', ${item.id})">
                ${item.text}
              </button>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function handleMatchClick(btn, type, id) {
    if (btn.classList.contains('matched')) return;

    if (type === 'left') {
      document.querySelectorAll('.match-btn[data-type="left"]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedLeft = { btn, id };
    } else {
      document.querySelectorAll('.match-btn[data-type="right"]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedRight = { btn, id };
    }

    if (selectedLeft && selectedRight) {
      if (selectedLeft.id === selectedRight.id) {
        selectedLeft.btn.classList.remove('selected');
        selectedRight.btn.classList.remove('selected');
        selectedLeft.btn.classList.add('matched');
        selectedRight.btn.classList.add('matched');
        selectedLeft.btn.disabled = true;
        selectedRight.btn.disabled = true;
        matchedCount++;

        selectedLeft = null;
        selectedRight = null;

        if (matchedCount === p2Sets[p2SetIndex].pairs.length) {
          setTimeout(() => {
            p2SetIndex++;
            renderPart2Set();
          }, 700);
        }
      } else {
        const el1 = selectedLeft.btn;
        const el2 = selectedRight.btn;
        el1.classList.add('shake');
        el2.classList.add('shake');
        
        setTimeout(() => {
          el1.classList.remove('shake', 'selected');
          el2.classList.remove('shake', 'selected');
          selectedLeft = null;
          selectedRight = null;
        }, 400);
      }
    }
  }

  // ================= 測驗結算畫面 =================
  function renderQuizSummary() {
    const container = document.getElementById('quizContainer');
    const totalP1 = p1Questions.length;
    const totalP2 = p2Sets.length;
    const pct = Math.round((p1Score / totalP1) * 100);
    const titleLabel = (currentBookData && currentBookData.bookTitle) || `Book ${currentBookNum}`;

    container.innerHTML = `
      <div class="quiz-card" style="padding: 35px 25px; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 8px;">🎉</div>
        <h2 style="font-size: 1.8rem; font-weight: 800; color: #1A365D; margin-bottom: 6px;">${titleLabel} 練習完成！</h2>
        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 24px;">你已經順利完成了兩大題的文法挑戰！</p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; margin-bottom: 24px;">
          <div style="background: #EBF8FF; border: 2px solid #BEE3F8; border-radius: 14px; padding: 18px 12px;">
            <div style="font-size: 0.95rem; font-weight: 700; color: #2B6CB0; margin-bottom: 6px;">第一大題 (選擇題)</div>
            <div style="font-size: 1.8rem; font-weight: 900; color: #1A365D;">${p1Score} <span style="font-size: 1rem; color: #718096;">/ ${totalP1}</span></div>
            <div style="font-size: 0.85rem; color: #4A5568; margin-top: 4px;">正確率 ${pct}%</div>
          </div>
          <div style="background: #F0FFF4; border: 2px solid #C6F6D5; border-radius: 14px; padding: 18px 12px;">
            <div style="font-size: 0.95rem; font-weight: 700; color: #276749; margin-bottom: 6px;">第二大題 (連連看)</div>
            <div style="font-size: 1.8rem; font-weight: 900; color: #1A365D;">${totalP2} <span style="font-size: 1rem; color: #718096;">/ ${totalP2}</span></div>
            <div style="font-size: 0.85rem; color: #4A5568; margin-top: 4px;">全數順利配對通關！</div>
          </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
          <button class="btn-start" style="padding: 12px 30px; font-size: 1.1rem;" onclick="startBookPractice()">🔄 重新挑戰</button>
          <button class="btn-secondary" style="padding: 12px 30px; font-size: 1.1rem;" onclick="navigateTo('screen-menu')">📚 回書籍目錄</button>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
